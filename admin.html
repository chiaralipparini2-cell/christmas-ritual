<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>Area riservata · Adria Beachwear</title>
<meta name="robots" content="noindex,nofollow">
</head><body>
<main class="wrap wide" id="app">
  <div class="brand"><div class="name">ADRIA</div><div class="sub">Area riservata</div></div>
  <div id="login" class="card hidden" style="max-width:460px;margin:0 auto">
    <form id="f-adm" novalidate>
      <label for="aemail">Email</label>
      <input type="email" id="aemail" inputmode="email" autocomplete="username" required>
      <label for="apw">Password</label>
      <input type="password" id="apw" autocomplete="current-password" required>
      <button class="btn" type="submit">Entra</button>
      <div id="m-adm" role="status"></div>
    </form>
  </div>
  <div id="panel" class="hidden">
    <div class="topbar"><span id="awho"></span><button class="linkbtn" id="alogout">Esci</button></div>
    <div class="stats" id="stats"></div>
    <h2 style="font-family:var(--serif);font-weight:500;margin:22px 0 6px">Scorte rimaste</h2>
    <ul class="stocklist" id="stock"></ul>
    <h2 style="font-family:var(--serif);font-weight:500;margin:22px 0 0">Richieste e codici</h2>
    <div class="bar">
      <input type="text" id="q" placeholder="Cerca codice, nome o email…" aria-label="Cerca">
      <select id="flt" aria-label="Filtro"><option value="todo">Da gestire</option><option value="done">Evase</option><option value="all">Tutti i premi</option></select>
    </div>
    <div id="list"></div>
  </div>
  <div id="aerr"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script src="assets/admin.js"></script>
</body></html>
